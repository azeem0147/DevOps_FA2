apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-event-frontend
  namespace: campus-fa2
  labels:
    app: campus-event-frontend
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: campus-event-frontend

  template:
    metadata:
      labels:
        app: campus-event-frontend

    spec:
      containers:
        - name: frontend
          image: campus-event-frontend:fa2
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
