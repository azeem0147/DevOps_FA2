apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: campus-fa2
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: "campus-event-backend"
        metrics_path: "/metrics"
        static_configs:
          - targets:
              - "backend:5000"
