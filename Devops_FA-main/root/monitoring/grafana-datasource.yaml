apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: campus-fa2
data:
  datasource.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

  dashboard-provider.yaml: |
    apiVersion: 1

    providers:
      - name: FA2 Dashboards
        orgId: 1
        folder: FA2 Monitoring
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10

        options:
          path: /var/lib/grafana/dashboards
